spring.application.name=interviewace-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/interviewace_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:replace-with-a-long-development-secret-key-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload.resume-directory=${RESUME_UPLOAD_DIR:uploads/resumes}
app.upload.max-resume-size=${MAX_RESUME_SIZE:5242880}
app.ai.base-url=${AI_SERVICE_URL:http://127.0.0.1:8000}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:5000}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:30000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
