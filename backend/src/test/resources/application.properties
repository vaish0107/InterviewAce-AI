spring.datasource.url=jdbc:h2:mem:interviewace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username
spring.datasource.password
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
jwt.secret=test-secret-key-that-is-at-least-thirty-two-characters-long
jwt.expiration=86400000
app.cors.frontend-url=http://localhost:5173
app.upload.resume-directory=target/test-uploads/resumes
app.upload.max-resume-size=5242880
app.ai.base-url=http://127.0.0.1:8000
app.ai.connect-timeout-ms=100
app.ai.read-timeout-ms=100
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
